<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>興雅三一堂</title>
    <style>
      html, body {
        background-image: url("雲圖片.jpg");
        background-size: cover;
        background-attachment: fixed;
        color: #333;
        margin: 0;
		padding: 0;
        font-family: sans-serif;
      }

      header {
  		position: relative;
  		width: 100%;
  		height: 115px; /* 👈 比 105 多一點點 */
  		margin: 0;
  		padding: 0;
  		display: flex;
  		align-items: flex-start;
  		color: #333;
	  }

	  .header-title {
  		display: flex;
  		align-items: flex-start;
  		margin: 0;
  		padding: 0 0 0 1px;   /* 👈 幾乎貼齊，但不冒險 */
		padding-left: 110px; /* 給 Logo 空間 */
	  }

	  #logo {
  		position: absolute;
  		top: 0; /* ⭐ 真正貼上邊界 */
  		left: 0; /* ⭐ 真正貼左邊界 */
  		max-height: 120px; /* 👈 回到你原本大小 */
	  }

	  /* 興雅三一堂文字 */
	  header h1 {
  		margin: 0 0 0 6px;    /* 👈 原本 12px → 改 6px 👈 就在 logo 右邊 */
  		line-height: 115px;  /* 👈 跟 header 高度一致 */
  		font-size: 32px;     /* 如果你想更接近原本也可調 */
  		display: inline-block;
	  }
      nav {
        background-color: #555;
        text-align: center;
        padding: 10px 0;
      }

      nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: inline-block;
      }

      nav li {
        display: inline-block;
        position: relative;
        margin: 0 10px;
      }

      nav a {
        color: white;
        text-decoration: none;
        padding: 10px 15px;
        display: block;
        font-size: 18px;
      }

      nav li:hover > a {
        background-color: #333;
      }

      /* 子選單樣式 */
      nav li ul {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: #555;
        padding: 0;
        z-index: 999;
        min-width: 160px;
      }

      @media (hover: hover) and (pointer: fine) {
  		nav li:hover > ul {
    		display: block;
  	  	}
	  }

      nav li ul li {
        display: block;
      }

      nav li ul li a {
        padding: 10px;
        text-align: left;
      }

      nav li ul li a:hover {
        background-color: #333;
      }

      .content {
        max-width: 1500px;
        margin: 0 auto;
        padding: 40px;
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        min-height: 60vh;
      }

	  .marquee-container {
  		position: absolute;
  		top: 0;
  		left: 50%;
  		transform: translateX(-50%);
  		width: 66%;
  		background-color: rgba(255,255,255,0.6);
  		padding: 5px;
  		border-radius: 8px;
  		z-index: 1000;
  		overflow: hidden;        /* ⭐⭐⭐ 就是這行 */
  		box-sizing: border-box;
	  }

	  .marquee-container button {
  		margin-left: 10px;
  		font-size: 14px;
  		vertical-align: middle;
	  }

	  .marquee-text {
  		display: inline-block;
  		white-space: nowrap;
  		animation: scroll 25s linear infinite;
  		padding-left: 100%;
		font-weight: bold;  /* ⭐ 這行就是讓文字粗體 */
	  }

	  /* JS / hover 都只是在切這個狀態 */
	  .marquee-text.paused {
  		animation-play-state: paused;
	  }

	  @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); } /* 文字完全跑完才回到右邊 */
	  }

      /* 桌機版隱藏漢堡按鈕 */
  	  .hamburger {
  		display: none;
  	  }
		
      /* 手機版樣式 */
	  /*使用者在『系統設定』裡面說：我不想看動畫，生效*/
	  @media (prefers-reduced-motion: reduce) {
  		.marquee-text {
    	  animation: none;
  		}
	  }

	  #toggle-marquee {
  		position: absolute;
  		right: 8px;
  		top: 50%;
  		transform: translateY(-50%);
  		font-size: 12px;
  		padding: 2px 6px;
  		border: none;
  		border-radius: 6px;
  		background: rgba(0,0,0,0.1);
  		cursor: pointer;
	  }
@media (max-width: 768px) {
  nav {
    margin: 0 7px;       /* 左右縮 7px */
    border-radius: 4px 4px 0 0; /* 上左 上右 下右 下左 直角*/
    overflow: hidden;     /* 避免子選單突出 */
  }

  nav ul {
    display: none;        /* 預設隱藏 */
    flex-direction: column;
    background: rgba(85, 85, 85, 0.95);
    position: absolute;
    top: 60px;
    left: 0;              /* 從 nav 左邊開始 */
    right: 0;             /* 到 nav 右邊結束 */
    border-radius: 0;     /* 這裡不用圓角，交給 nav 控制 */
  }

  nav ul.show {
    display: flex;
  }
	
  nav li {
    display: block;
    margin: 0;
  }

  nav a {
    padding: 15px;
    font-size: 16px;
    text-align: left;
  }

  /* 子選單縮排 */
  nav li ul {
    display: none;
  }
  nav li.open > ul {
    display: block;
  }

  nav li ul li a {
    padding-left: 30px; /* 縮排 */
  }

  /* 漢堡按鈕 */
  .hamburger {
  	display: block;
  	cursor: pointer;
  	font-size: 24px;   /* 字體稍微小一點 */
  	color: white;
  	padding: 5px 15px; /* 上下縮小 padding → 灰框高度就變矮 */
  	text-align: right;
  }

  /* 白框內容 */
  .content {
  	width: auto;
  	margin: 0 10px;      /* 左右留白 */
  	padding: 10px;
  	box-sizing: border-box;
  }
  #logo {
    position: absolute;
    top: 0;      /* 貼齊上邊界 */
    left: 0;     /* 貼齊左邊界 */
    max-width: 120px;  /* 跟桌機版一樣 */
    max-height: 120px;
    margin: 0;   /* 不再用負 margin */
  }
  .marquee-text {
    animation: scroll 18s linear infinite; /* 保持跟電腦版一樣的跑馬燈 */
  }
  /* AI 小助手框 */
  #ai-helper {
  	margin: 20px auto;
  	padding: 10px;
  	max-width: 400px;
  	background: #f9f9f9;
  	border: 1px solid #ccc;
  	border-radius: 8px;
  	box-sizing: border-box;
  }
}
    </style>
  </head>
  <body>

  	  <div class="marquee-container" id="marquee-area">
  		<div class="marquee-text" id="marquee-text">
    		📢 歡迎來到興雅三一堂！每週日早上10點都有主日崇拜，誠摯邀請您參加～
  		</div>
  		<button id="toggle-marquee">⏸ 暫停公告</button>
	  </div>
	  

  	  <div class="header-title">
    	<img id="logo" src="興雅三一堂logo-removebg-preview.png" alt="Logo" />
    	<h1><a href="教會網站.html">興雅三一堂</a></h1>
  	  </div>
	</header>
    <nav>
  <div class="hamburger">☰</div>
  <ul>
    <li><a href="教會網站.html">教會主頁</a></li>
    <li class="has-submenu">
      <a href="關於我們.html">關於我們</a>
      <ul>
        <li><a href="牧師名單.html">牧師名單</a></li>
        <li><a href="教會場地.html">教會場地</a></li>
        <li><a href="敬拜流程.html">敬拜流程</a></li>
        <li><a href="外聘講員.html">外聘講員</a></li>
      </ul>
    </li>
    <li><a href="主日回顧.html">主日回顧</a></li>
    <li class="has-submenu">
      <a href="有關教會服務.html">有關教會服務</a>
      <ul>
        <li><a href="代禱.html">代禱</a></li>
        <li><a href="每日經文.html">每日經文</a></li>
        <li><a href="其他方面.html">其他方面</a></li>
      </ul>
    </li>
    <li><a href="聯繫我們.html">聯繫我們</a></li>
  	</ul>
	</nav>
    <div class="content">
      <h2>歡迎來到興雅三一堂網站</h2>
      <p>我們教會的服務：您可以留下事項為您來代禱，或者播打電話02-25176539，如果您真的需要，我們也可以過去探訪您，讓您有機會認識神，看見神的榮耀。</p>
	  <p>也歡迎有需要的朋友進到教會裡，讓我們更多的關心您。</p>
	  
      <!-- 在這裡添加更多內容 -->
    </div>
	<div id="ai-helper" style="border:1px solid #ccc; padding:10px; max-width:400px; background:#f9f9f9; border-radius:8px;">
		<h3>AI 小助手</h3>
		<div id="chat-box" style="height:150px; overflow-y:auto; border:1px solid #ddd; padding:8px; background:#fff; margin-bottom:8px;"></div>
		<input type="text" id="user-input" placeholder="請輸入您的問題..." style="width:calc(100% - 70px); padding:6px;"/>
		<button id="send-btn" style="width:60px;">送出</button>
	</div>

	<script>
		const chatBox = document.getElementById('chat-box');
		const userInput = document.getElementById('user-input');
		const sendBtn = document.getElementById('send-btn');

		function appendMessage(sender, text) {
		const msgDiv = document.createElement('div');
		msgDiv.style.marginBottom = '6px';
		msgDiv.style.padding = '6px';
		msgDiv.style.borderRadius = '5px';
		if(sender === 'user') {
			msgDiv.style.backgroundColor = '#d0e7ff';
			msgDiv.style.textAlign = 'right';
			msgDiv.textContent = '你：' + text;
		} else {
			msgDiv.style.backgroundColor = '#e6e6e6';
			msgDiv.style.textAlign = 'left';
			msgDiv.textContent = 'AI：' + text;
		}
		chatBox.appendChild(msgDiv);
		chatBox.scrollTop = chatBox.scrollHeight;
	}

	function getAIResponse(question) {
    // 這裡可以換成串接 API，先用簡單固定回應模擬
    const lower = question.toLowerCase();
    if(lower.includes('聚會時間') || lower.includes('時間')) {
      return '我們的主日聚會時間是每週日上午10點喔，邀請您一起來參加聚會喔~。';
    } else if(lower.includes('地址')) {
      return '我們教會地址是台北市中山區松江路259巷33號B1喔，有興趣可以一起來參加聚會喔~。';
    } else if(lower.includes('聯絡方式')) {
      return '您可以撥打電話02-2517-6539來聯繫我們喔。'; //或 Email: contact@church.org
    } else if(lower.includes('代禱')) {
      return '若需要代禱的話可留下您需要代禱的項目，我們將會為您一同代禱喔~';
    } else if(lower.includes('過去') || lower.includes('怎麼來') || lower.includes('怎麼走') || lower.includes('交通') || lower.includes('路線') || lower.includes('怎麼去')) {
	  return '您可以搭到行天宮站3號出口，往左邊走進彰化銀行的巷子，再走到一個咖啡廳George House左轉，就會看到我們教會的藍色招牌了喔~';
    } else if(lower.includes('教會名稱') || lower.includes('名稱')) {
	  return '我們的教會名稱為興雅三一堂，如果您有空，邀請您一同來聚會喔~';
    } else if(lower.includes('牧師名單') || lower.includes('牧師') || lower.includes('牧師有哪些')) {
	  return '目前本堂主日證道以本堂牧者為主，並不定期邀請外聘講員。我們牧師目前有主任牧師林雪瑩牧師，還有蔡主安牧師。也曾過去曾蒙黃德福牧師、鄭頌苑牧師等牧者蒞臨證道，成為本堂寶貴的祝福。歡迎一起來參加聚會呦~';
    } else if (lower.includes('聚會流程') || lower.includes('流程') || lower.includes('程序')) {
	  return '我們的主日聚會從上午10點正式開始；若是敬拜讚美團隊的同工，則會在9點半先行練習。聚會流程是：首先由司會帶領宣召，接著是敬拜讚美時間，然後牧師會講道。如果是每月的第一個主日，會舉行聖餐；4月的第一主日則會進行清明追思。接下來是奉獻時間，若當天有新朋友也會歡迎與介紹。若是聖誕節將會有表演節目。之後我們會唱讚美詩歌本的第11首(聖誕節唱平安夜)，最後由牧師祝禱，並唱阿們頌作為結束喔～歡迎您來親身體驗我們的聚會！';
    } else if (lower.includes('今日經文') || lower.includes('今日經節') || lower.includes('經文') || lower.includes('經節')) {
	  return '今日經文為帖撒羅尼迦前書 4:1-12，可於手機查詢此處經文。';
	} else {
      return '抱歉，我還在學習中，請稍後再問我其他問題吧！！感謝您的詢問，還有想詢問的事項嗎？我知道的話會盡力回覆喔~';
    }
  }

  sendBtn.addEventListener('click', () => {
    const question = userInput.value.trim();
    if(!question) return;
    appendMessage('user', question);
    userInput.value = '';
    setTimeout(() => {
      const answer = getAIResponse(question);
      appendMessage('ai', answer);
    }, 600);
  });

  userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') {
      sendBtn.click();
    }
  });
</script>	
    <script>
      function handleSelect(select) {
        select.options[0].style.display = 'none';
      }
    </script>
	<script>
    const hamburger = document.querySelector(".hamburger");
	const navMenu = document.querySelector("nav ul");

	// ☰ 開關主選單
	hamburger.addEventListener("click", function (e) {
  		e.preventDefault();
  		e.stopPropagation();
  		navMenu.classList.toggle("show");
	});

	// 子選單（關於我們）
	document.querySelectorAll(".has-submenu > a").forEach(link => {
  		link.addEventListener("click", function (e) {
    		if (window.innerWidth > 768) return;
		    const li = this.parentElement;
    		const isOpen = li.classList.contains("open");
		    if (!isOpen) {
      		// 第一次點：只展開，不跳頁
      			e.preventDefault();
      			e.stopPropagation();
	        // 先關掉其他已開的子選單
      			document.querySelectorAll(".has-submenu.open").forEach(openLi => {
        		openLi.classList.remove("open");
      		});
	        li.classList.add("open");
    	  }
    	  // 第二次點：不 prevent → 正常進頁面
  	  });
	});

	// 點 nav 裡，不要傳到 document
	navMenu.addEventListener("click", function (e) {
  		e.stopPropagation();
	});

	// 點空白處
	document.addEventListener("click", function () {
  		if (window.innerWidth > 768) return;
  		const openSubmenu = document.querySelector(".has-submenu.open");
  		if (openSubmenu) {
    		openSubmenu.classList.remove("open");
  		} else {
    		navMenu.classList.remove("show");
  		}
	});
  </script>
  <script>
  const marquee = document.getElementById("marquee-text");
  const btn = document.getElementById("toggle-marquee");
  const marqueeArea = document.getElementById("marquee-area");
  let isPaused = false;
  // 🔘 按鈕控制（桌機 & 手機共用）
  btn.addEventListener("click", () => {
    isPaused = !isPaused;
    marquee.classList.toggle("paused", isPaused);
    btn.textContent = isPaused ? "▶️ 播放公告" : "⏸ 暫停公告";
  });
  // 🖥 桌機 hover 停止（只有滑鼠裝置才會有）
  marqueeArea.addEventListener("mouseenter", () => {
    if (!isPaused) marquee.classList.add("paused");
  });
  marqueeArea.addEventListener("mouseleave", () => {
    if (!isPaused) marquee.classList.remove("paused");
  });
</script>

</html>
